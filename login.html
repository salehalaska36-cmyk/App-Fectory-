<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 350px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #e0e1dd;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #415a77;
            border-radius: 5px;
            background-color: #0d1b2a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #415a77;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #778da9;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" required placeholder="ادخل بريدك الإلكتروني">
            </div>
            <button type="submit" class="btn">دخول</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // استرجاع البريد المحفوظ مسبقاً إن وجد لتسهيل الدخول
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('user_email');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const adminEmail = 'salehalaska36@gmail.com';

            // حفظ البريد في المتصفح ليظهر في المرات القادمة
            localStorage.setItem('user_email', emailInput);

            const messageDiv = document.getElementById('message');

            if (emailInput === adminEmail) {
                messageDiv.style.color = '#4ade80';
                messageDiv.textContent = 'أهلاً بك يا أدمن! جاري توجيهك لوحة التحكم...';
                // يمكنك توجيهه لصفحة الأدمن هنا
            } else {
                messageDiv.style.color = '#60a5fa';
                messageDiv.textContent = 'تم تسجيل الدخول بنجاح كمستخدم عادي.';
                // توجيه المستخدم العادي لصفحته
            }
        });
    </script>

</body>
</html>
